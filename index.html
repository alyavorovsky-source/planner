<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой планер</title>
<meta name="description" content="Мой планер — локальный планировщик дня: задачи, календарь, привычки, статистика. Данные хранятся в вашем браузере.">
<meta name="theme-color" content="#15161c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мой планер">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234585f5'/><path d='M28 52l14 14 30-32' stroke='white' stroke-width='10' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div class="app" id="app">
  <!-- ===== Sidebar ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar__brand">
      <svg class="brand__logo" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="currentColor"/><path d="M28 52l14 14 30-32" stroke="var(--bg)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="brand__name">Мой планер</span>
      <button class="icon-btn sidebar__close" id="sidebarClose" data-icon="close" aria-label="Закрыть меню"></button>
    </div>

    <nav class="nav" id="nav" aria-label="Основная навигация"></nav>

    <div class="sidebar__footer">
      <button class="nav-item" data-nav="settings" type="button">
        <span class="nav-item__icon" data-icon="settings"></span>
        <span class="nav-item__text">Настройки</span>
      </button>
      <button class="nav-item" id="themeToggle" type="button">
        <span class="nav-item__icon" id="themeIcon"></span>
        <span class="nav-item__text" id="themeLabel">Светлая тема</span>
      </button>
      <button class="app-version" id="appVersion" type="button" data-act="whats-new" title="Что нового в этой версии"></button>
      <div class="storage-info" id="storageInfo" title="Данные хранятся локально в вашем браузере (localStorage) и никуда не отправляются"></div>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <!-- ===== Main ===== -->
  <div class="main">
    <header class="topbar">
      <button class="icon-btn topbar__burger" id="burger" data-icon="menu" aria-label="Открыть меню"></button>
      <div class="topbar__date">
        <div class="topbar__greeting" id="greeting">Добрый день</div>
        <div class="topbar__today" id="topDate"></div>
      </div>
      <div class="topbar__search">
        <span class="topbar__search-icon" data-icon="search"></span>
        <input type="text" id="searchInput" placeholder="Поиск задач… (Ctrl+K)" autocomplete="off" aria-label="Поиск задач">
        <kbd class="topbar__search-kbd">Ctrl K</kbd>
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <button class="icon-btn topbar__icon" id="topSettings" data-icon="settings" aria-label="Настройки"></button>
      <button class="btn btn--primary topbar__add" id="addTaskBtn" type="button">
        <span data-icon="plus"></span><span class="topbar__add-text">Добавить задачу</span>
      </button>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- ===== Modal root ===== -->
<div class="modal-root" id="modalRoot" hidden>
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="modalBox">
    <div class="modal__header">
      <h2 class="modal__title" id="modalTitle"></h2>
      <button class="icon-btn modal__close" id="modalClose" aria-label="Закрыть"></button>
    </div>
    <div class="modal__body" id="modalBody"></div>
    <div class="modal__footer" id="modalFooter"></div>
  </div>
</div>

<!-- ===== Toasts ===== -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="js/version.js"></script>
<script src="js/utils.js"></script>
<script src="js/icons.js"></script>
<script src="js/store.js"></script>
<script src="js/views.js"></script>
<script src="js/comments.js"></script>
<script src="js/whatsnew.js"></script>
<script src="js/reminders.js"></script>
<script src="js/app.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
